[project]
name = "charismate-backend"
version = "0.1.0"
description = "Charismate research, script generation, and avatar video backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "aiosqlite",
  "fal-client",
  "fastapi",
  "httpx",
  "openai",
  "pydantic",
  "pydantic-settings",
  "python-dotenv",
  "python-multipart",
  "sse-starlette",
  "tavily-python",
  "uvicorn[standard]",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
